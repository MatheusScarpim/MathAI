name: mathai-dev

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mathai-api-dev
    working_dir: /app
    command: npm --workspace apps/api run dev
    env_file:
      - .env
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    image: node:20-alpine
    container_name: mathai-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - VITE_PROXY_TARGET=http://api:3001
    ports:
      - "${FRONTEND_PORT:-5174}:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: mathai-qdrant-dev
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  mongo:
    image: mongo:7
    container_name: mathai-mongo-dev
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: mathai-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  qdrant_data:
  mongo_data:
  redis_data:
