name: mathai

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mathai-api
    working_dir: /app
    command: npm --workspace apps/api run dev
    environment:
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=300
    env_file:
      - .env
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
      - auraia_workspaces:/data/auraia-workspaces
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      # Gate api boot on the universal fallback provider only. Codex/anthropic
      # are flaky and self-heal via the router's per-request health skip, so
      # gating on them would risk api never starting. deepseek-healthy
      # guarantees the router always has at least one working provider.
      openclaude-deepseek:
        condition: service_healthy

  # Legacy single-provider container (mantém compatibilidade — OPENCLAUDE_GRPC_URL aponta aqui por padrão).
  openclaude:
    image: oven/bun:1
    container_name: mathai-openclaude
    restart: unless-stopped
    working_dir: /openclaude
    command: >
      sh -c "
        apt-get update && apt-get install -y git gh 2>/dev/null || apk add --no-cache git github-cli 2>/dev/null;
        if ! git rev-parse --git-dir >/dev/null 2>&1 || [ ! -f package.json ]; then
          echo '[entrypoint] no valid clone (missing/partial), re-cloning main' && find . -mindepth 1 -delete 2>/dev/null; git clone https://github.com/Gitlawb/openclaude.git .;
        fi &&
        if [ -n \"${OPENCLAUDE_PR}\" ]; then
          git fetch origin pull/${OPENCLAUDE_PR}/head &&
          git reset --hard FETCH_HEAD;
        else
          git fetch origin && git checkout ${OPENCLAUDE_BRANCH:-main} && git reset --hard origin/${OPENCLAUDE_BRANCH:-main};
        fi &&
        PREV_BUILT=$$(cat .openclaude-built-head 2>/dev/null || echo none) &&
        CUR_HEAD=$$(git rev-parse HEAD 2>/dev/null || echo nohead) &&
        if [ \"$$PREV_BUILT\" != \"$$CUR_HEAD\" ] || [ ! -d node_modules ] || [ ! -d dist ]; then
          echo \"[entrypoint] building $$PREV_BUILT -> $$CUR_HEAD\" && bun install && bun run build && git rev-parse HEAD > .openclaude-built-head;
        else
          echo \"[entrypoint] up-to-date at $$CUR_HEAD, skipping install/build\";
        fi &&
        if [ -f src/entrypoints/sdk/index.ts ] && ! grep -q 'setTimeout(detectStubLeaks' src/entrypoints/sdk/index.ts; then sed -i '/^detectStubLeaks()/c\setTimeout(detectStubLeaks, 0)' src/entrypoints/sdk/index.ts; fi &&
        ( while sleep 60; do DIRTY=$$(git status --porcelain --untracked-files=no 2>/dev/null | grep -v 'entrypoints/sdk/index.ts'); CUR=$$(git rev-parse HEAD 2>/dev/null || echo x); WANT=$$(cat .openclaude-built-head 2>/dev/null || echo \"$$CUR\"); if [ -n \"$$DIRTY\" ] || [ \"$$CUR\" != \"$$WANT\" ]; then echo '[self-heal] openclaude source drift detected, restoring built source'; git reset --hard \"$$WANT\" >/dev/null 2>&1; if [ -f src/entrypoints/sdk/index.ts ] && ! grep -q 'setTimeout(detectStubLeaks' src/entrypoints/sdk/index.ts; then sed -i '/^detectStubLeaks()/c\setTimeout(detectStubLeaks, 0)' src/entrypoints/sdk/index.ts; fi; fi; done ) &
        bun run dev:grpc
      "
    environment:
      - GRPC_PORT=50051
      - GRPC_HOST=0.0.0.0
      - CLAUDE_CODE_USE_OPENAI=${CLAUDE_CODE_USE_OPENAI:-0}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENCLAUDE_MODEL:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
    ports:
      - "${OPENCLAUDE_GRPC_PORT:-50051}:50051"
    volumes:
      - openclaude_app:/openclaude
      - auraia_workspaces:/data/auraia-workspaces
    healthcheck:
      test: ["CMD", "bun", "-e", "const s=require('net').connect(50051,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s

  # ─── Multi-provider fleet (router escolhe um destes por subtask) ───
  # Cada container tem seu próprio /root pra persistir OAuth tokens
  # obtidos via `/provider` ou `/onboard-github` interativos.

  openclaude-anthropic:
    image: oven/bun:1
    container_name: mathai-openclaude-anthropic
    restart: unless-stopped
    working_dir: /openclaude
    command: >
      sh -c "
        apt-get update && apt-get install -y git gh 2>/dev/null || apk add --no-cache git github-cli 2>/dev/null;
        if ! git rev-parse --git-dir >/dev/null 2>&1 || [ ! -f package.json ]; then
          echo '[entrypoint] no valid clone (missing/partial), re-cloning main' && find . -mindepth 1 -delete 2>/dev/null; git clone https://github.com/Gitlawb/openclaude.git .;
        fi &&
        if [ -n \"${OPENCLAUDE_ANTHROPIC_PR}\" ]; then
          git fetch origin pull/${OPENCLAUDE_ANTHROPIC_PR}/head &&
          git reset --hard FETCH_HEAD;
        else
          git fetch origin && git checkout ${OPENCLAUDE_BRANCH:-main} && git reset --hard origin/${OPENCLAUDE_BRANCH:-main};
        fi &&
        PREV_BUILT=$$(cat .openclaude-built-head 2>/dev/null || echo none) &&
        CUR_HEAD=$$(git rev-parse HEAD 2>/dev/null || echo nohead) &&
        if [ \"$$PREV_BUILT\" != \"$$CUR_HEAD\" ] || [ ! -d node_modules ] || [ ! -d dist ]; then
          echo \"[entrypoint] building $$PREV_BUILT -> $$CUR_HEAD\" && bun install && bun run build && git rev-parse HEAD > .openclaude-built-head;
        else
          echo \"[entrypoint] up-to-date at $$CUR_HEAD, skipping install/build\";
        fi &&
        if [ -f src/entrypoints/sdk/index.ts ] && ! grep -q 'setTimeout(detectStubLeaks' src/entrypoints/sdk/index.ts; then sed -i '/^detectStubLeaks()/c\setTimeout(detectStubLeaks, 0)' src/entrypoints/sdk/index.ts; fi &&
        ( while sleep 60; do DIRTY=$$(git status --porcelain --untracked-files=no 2>/dev/null | grep -v 'entrypoints/sdk/index.ts'); CUR=$$(git rev-parse HEAD 2>/dev/null || echo x); WANT=$$(cat .openclaude-built-head 2>/dev/null || echo \"$$CUR\"); if [ -n \"$$DIRTY\" ] || [ \"$$CUR\" != \"$$WANT\" ]; then echo '[self-heal] openclaude source drift detected, restoring built source'; git reset --hard \"$$WANT\" >/dev/null 2>&1; if [ -f src/entrypoints/sdk/index.ts ] && ! grep -q 'setTimeout(detectStubLeaks' src/entrypoints/sdk/index.ts; then sed -i '/^detectStubLeaks()/c\setTimeout(detectStubLeaks, 0)' src/entrypoints/sdk/index.ts; fi; fi; done ) &
        bun run dev:grpc
      "
    environment:
      - GRPC_PORT=50051
      - GRPC_HOST=0.0.0.0
      - OPENCLAUDE_PROVIDER_HINT=anthropic
      # Bypass do fallback "default Codex" do start-grpc.ts quando settings.json esta vazio.
      # Sem isso o gRPC server tenta carregar codex auth (que nao existe aqui), emite warning
      # "ignoring saved provider profile" e fica num estado meio-quebrado onde requests
      # vao via gRPC retornam stream vazio. Com a flag, buildStartupEnvFromProfile retorna
      # process.env limpo e o engine usa OAuth nativo de /root/.openclaude/.credentials.json.
      - CLAUDE_CODE_PROVIDER_PROFILE_ENV_APPLIED=1
      # openclaude origin/main tem bug na feature de global prompt-cache firstParty:
      # aplica cache_control.scope:"global" no system[0], mas as tool definitions
      # renderizam antes → nao e prefixo verdadeiro → Anthropic rejeita com
      # "API Error 400 invalid_request cache_control.scope global". Resultado: gRPC
      # retorna stream vazio (in=0) enquanto o CLI -p (sem tools) funciona. Desligar
      # o prompt caching contorna o bug (validado 2026-07-20: in=22578, PONG).
      - DISABLE_PROMPT_CACHING=1
    ports:
      - "${OPENCLAUDE_ANTHROPIC_PORT:-50052}:50051"
    volumes:
      - openclaude_anthropic_app:/openclaude
      - openclaude_anthropic_home:/root
      - auraia_workspaces:/data/auraia-workspaces
    healthcheck:
      test: ["CMD", "bun", "-e", "const s=require('net').connect(50051,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s

  openclaude-codex:
    image: oven/bun:1
    container_name: mathai-openclaude-codex
    restart: unless-stopped
    working_dir: /openclaude
    command: >
      sh -c "
        apt-get update && apt-get install -y git gh 2>/dev/null || apk add --no-cache git github-cli 2>/dev/null;
        if ! git rev-parse --git-dir >/dev/null 2>&1 || [ ! -f package.json ]; then
          echo '[entrypoint] no valid clone (missing/partial), re-cloning main' && find . -mindepth 1 -delete 2>/dev/null; git clone https://github.com/Gitlawb/openclaude.git .;
        fi &&
        if [ -n \"${OPENCLAUDE_CODEX_PR}\" ]; then
          git fetch origin pull/${OPENCLAUDE_CODEX_PR}/head &&
          git reset --hard FETCH_HEAD;
        else
          git fetch origin && git checkout ${OPENCLAUDE_BRANCH:-main} && git reset --hard origin/${OPENCLAUDE_BRANCH:-main};
        fi &&
        PREV_BUILT=$$(cat .openclaude-built-head 2>/dev/null || echo none) &&
        CUR_HEAD=$$(git rev-parse HEAD 2>/dev/null || echo nohead) &&
        if [ \"$$PREV_BUILT\" != \"$$CUR_HEAD\" ] || [ ! -d node_modules ] || [ ! -d dist ]; then
          echo \"[entrypoint] building $$PREV_BUILT -> $$CUR_HEAD\" && bun install && bun run build && git rev-parse HEAD > .openclaude-built-head;
        else
          echo \"[entrypoint] up-to-date at $$CUR_HEAD, skipping install/build\";
        fi &&
        if [ -f src/entrypoints/sdk/index.ts ] && ! grep -q 'setTimeout(detectStubLeaks' src/entrypoints/sdk/index.ts; then sed -i '/^detectStubLeaks()/c\setTimeout(detectStubLeaks, 0)' src/entrypoints/sdk/index.ts; fi &&
        ( while sleep 60; do DIRTY=$$(git status --porcelain --untracked-files=no 2>/dev/null | grep -v 'entrypoints/sdk/index.ts'); CUR=$$(git rev-parse HEAD 2>/dev/null || echo x); WANT=$$(cat .openclaude-built-head 2>/dev/null || echo \"$$CUR\"); if [ -n \"$$DIRTY\" ] || [ \"$$CUR\" != \"$$WANT\" ]; then echo '[self-heal] openclaude source drift detected, restoring built source'; git reset --hard \"$$WANT\" >/dev/null 2>&1; if [ -f src/entrypoints/sdk/index.ts ] && ! grep -q 'setTimeout(detectStubLeaks' src/entrypoints/sdk/index.ts; then sed -i '/^detectStubLeaks()/c\setTimeout(detectStubLeaks, 0)' src/entrypoints/sdk/index.ts; fi; fi; done ) &
        bun run dev:grpc
      "
    environment:
      - GRPC_PORT=50051
      - GRPC_HOST=0.0.0.0
      - OPENCLAUDE_PROVIDER_HINT=codex
    ports:
      - "${OPENCLAUDE_CODEX_PORT:-50053}:50051"
    volumes:
      - openclaude_codex_app:/openclaude
      - openclaude_codex_home:/root
      - auraia_workspaces:/data/auraia-workspaces
    healthcheck:
      test: ["CMD", "bun", "-e", "const s=require('net').connect(50051,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s

  openclaude-deepseek:
    image: oven/bun:1
    container_name: mathai-openclaude-deepseek
    restart: unless-stopped
    working_dir: /openclaude
    command: >
      sh -c "
        apt-get update && apt-get install -y git gh 2>/dev/null || apk add --no-cache git github-cli 2>/dev/null;
        if ! git rev-parse --git-dir >/dev/null 2>&1 || [ ! -f package.json ]; then
          echo '[entrypoint] no valid clone (missing/partial), re-cloning main' && find . -mindepth 1 -delete 2>/dev/null; git clone https://github.com/Gitlawb/openclaude.git .;
        fi &&
        if [ -n \"${OPENCLAUDE_PR}\" ]; then
          git fetch origin pull/${OPENCLAUDE_PR}/head &&
          git reset --hard FETCH_HEAD;
        else
          git fetch origin && git checkout ${OPENCLAUDE_BRANCH:-main} && git reset --hard origin/${OPENCLAUDE_BRANCH:-main};
        fi &&
        PREV_BUILT=$$(cat .openclaude-built-head 2>/dev/null || echo none) &&
        CUR_HEAD=$$(git rev-parse HEAD 2>/dev/null || echo nohead) &&
        if [ \"$$PREV_BUILT\" != \"$$CUR_HEAD\" ] || [ ! -d node_modules ] || [ ! -d dist ]; then
          echo \"[entrypoint] building $$PREV_BUILT -> $$CUR_HEAD\" && bun install && bun run build && git rev-parse HEAD > .openclaude-built-head;
        else
          echo \"[entrypoint] up-to-date at $$CUR_HEAD, skipping install/build\";
        fi &&
        if [ -f src/entrypoints/sdk/index.ts ] && ! grep -q 'setTimeout(detectStubLeaks' src/entrypoints/sdk/index.ts; then sed -i '/^detectStubLeaks()/c\setTimeout(detectStubLeaks, 0)' src/entrypoints/sdk/index.ts; fi &&
        ( while sleep 60; do DIRTY=$$(git status --porcelain --untracked-files=no 2>/dev/null | grep -v 'entrypoints/sdk/index.ts'); CUR=$$(git rev-parse HEAD 2>/dev/null || echo x); WANT=$$(cat .openclaude-built-head 2>/dev/null || echo \"$$CUR\"); if [ -n \"$$DIRTY\" ] || [ \"$$CUR\" != \"$$WANT\" ]; then echo '[self-heal] openclaude source drift detected, restoring built source'; git reset --hard \"$$WANT\" >/dev/null 2>&1; if [ -f src/entrypoints/sdk/index.ts ] && ! grep -q 'setTimeout(detectStubLeaks' src/entrypoints/sdk/index.ts; then sed -i '/^detectStubLeaks()/c\setTimeout(detectStubLeaks, 0)' src/entrypoints/sdk/index.ts; fi; fi; done ) &
        bun run dev:grpc
      "
    environment:
      - GRPC_PORT=50051
      - GRPC_HOST=0.0.0.0
      - CLAUDE_CODE_USE_OPENAI=1
      - OPENAI_API_KEY=${DEEPSEEK_API_KEY:-${OPENAI_API_KEY:-}}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL_DEEPSEEK:-https://api.deepseek.com}
      - OPENAI_MODEL=${OPENCLAUDE_MODEL_DEEPSEEK:-deepseek-chat}
      - OPENCLAUDE_PROVIDER_HINT=deepseek
    ports:
      - "${OPENCLAUDE_DEEPSEEK_PORT:-50054}:50051"
    volumes:
      - openclaude_deepseek_app:/openclaude
      - openclaude_deepseek_home:/root
      - auraia_workspaces:/data/auraia-workspaces
    healthcheck:
      test: ["CMD", "bun", "-e", "const s=require('net').connect(50051,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s

  frontend:
    image: node:20-alpine
    container_name: mathai-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - VITE_PROXY_TARGET=http://api:3001
    ports:
      - "${FRONTEND_PORT:-5174}:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: mathai-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  mongo:
    image: mongo:7
    container_name: mathai-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: mathai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  qdrant_data:
  mongo_data:
  redis_data:
  openclaude_app:
  openclaude_anthropic_app:
  openclaude_anthropic_home:
  openclaude_codex_app:
  openclaude_codex_home:
  openclaude_deepseek_app:
  openclaude_deepseek_home:
  auraia_workspaces:
