name: mathai

services:
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: mathai-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  mongo:
    image: mongo:7
    container_name: mathai-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: mathai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    image: "${MATHAI_API_IMAGE:-mathai-api:latest}"
    container_name: mathai-api
    restart: unless-stopped
    pull_policy: always
    env_file:
      - ../.env
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    image: "${MATHAI_FRONTEND_IMAGE:-mathai-frontend:latest}"
    container_name: mathai-frontend
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  qdrant_data:
  mongo_data:
  redis_data:
