version: "3.9"
services:
  qdrant:
    image: qdrant/qdrant:v1.16.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      - qdrant
      - mongo
      - redis
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
volumes:
  qdrant_data:
  mongo_data:
